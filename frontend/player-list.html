<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Player List -- Pickleball Tournament</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <h1>🏓 Player List</h1>
  <nav><a href="dashboard.html">Menu</a><button onclick="logout()">Log Out</button></nav>
</header>
<main>
  <div class="card">
    <div id="playerListContent" class="muted">Loading...</div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/guard.js"></script>
<script>
requireLogin();
async function load() {
  const el = document.getElementById('playerListContent');
  try {
    const data = await Api.get('/players/list');
    if (data.players.length === 0) { el.innerHTML = '<p class="muted">No players registered yet.</p>'; return; }
    let currentDivision = null;
    let html = '';
    data.players.forEach((p) => {
      if (p.division !== currentDivision) {
        currentDivision = p.division;
        if (html) html += '</table>';
        html += `<h2>${divisionLabel(p.division)}</h2><table><thead><tr><th>Name</th><th>Team #</th><th>Partner</th></tr></thead><tbody>`;
      }
      html += `<tr><td>${p.firstName} ${p.lastName}</td><td>${p.teamNumber || '--'}</td><td>${p.hasPartner ? p.partnerName : '<span class="muted">no partner yet</span>'}</td></tr>`;
    });
    html += '</table>';
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="error-box">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
